// Engines
@PART:HAS[@MODULE[ModuleEngines*],!MODULE[ModuleCommand],~CrewCapacity[>0],!MODULE[ModuleCargoBay]]:FOR[zy_PartPatchUtils]
{
	ppuEngine = true
}

// Pods
@PART:HAS[@MODULE[ModuleCommand],#CrewCapacity[>0]]:FOR[zy_PartPatchUtils]
{
	ppuPod = true
}

// Tanks
@PART:HAS[!MODULE[ModuleEngines*],!MODULE[ModuleCommand],~CrewCapacity[>0],!MODULE[ModuleCargoBay],@RESOURCE[L*q*d*],!MODULE:HAS[@PROPELLANT[L*q*d*]],!MODULE:HAS[#resourceName[L*q*d*]]]:FOR[zy_PartPatchUtils]
{
	ppuTank = true
}
@PART:HAS[!MODULE[ModuleEngines*],!MODULE[ModuleCommand],~CrewCapacity[>0],!MODULE[ModuleCargoBay],@RESOURCE[Oxidizer],!MODULE:HAS[@PROPELLANT[Oxidizer]],!MODULE:HAS[#resourceName[Oxidizer]]]:FOR[zy_PartPatchUtils]
{
	ppuTank = true
}
@PART:HAS[!MODULE[ModuleEngines*],!MODULE[ModuleCommand],~CrewCapacity[>0],!MODULE[ModuleCargoBay],@RESOURCE[MonoPropellant],!MODULE:HAS[@PROPELLANT[MonoPropellant]],!MODULE:HAS[#resourceName[MonoPropellant]]]:FOR[zy_PartPatchUtils]
{
	ppuTank = true
}

// Heatshields
@PART:HAS[@MODULE[ModuleAblator],!MODULE[ModuleEngines*],!MODULE[ModuleCommand],~CrewCapacity[>0],!MODULE[ModuleCargoBay]]:FOR[zy_PartPatchUtils]
{
	ppuHeatShield = true
}

// Fix tank category
@PART:HAS[#ppuTank[true],#category[Propulsion]]:AFTER[zy_PartPatchUtils]
{
	@category = FuelTank
}