@PART:HAS[@MODULE[ModuleB9PartSwitch]]:FOR[zzy_PartPatchUtils]
{
	@MODULE[ModuleB9PartSwitch],*
	{
		@SUBTYPE,*
		{
			%ppuVolume = 0
		}
	}
}
@PART:HAS[@MODULE[ModuleB9PartSwitch]:HAS[#baseVolume]]:FOR[zzy_PartPatchUtils]
{
	@MODULE[ModuleB9PartSwitch]:HAS[#baseVolume],*
	{
		@SUBTYPE,*
		{
			@ppuVolume += #$../baseVolume$
		}
	}
}
@PART:HAS[@MODULE[ModuleB9PartSwitch]:HAS[@SUBTYPE:HAS[#volumeAdded]]]:FOR[zzy_PartPatchUtils]
{
	@MODULE[ModuleB9PartSwitch]:HAS[#baseVolume],*
	{
		@SUBTYPE:HAS[#volumeAdded],*
		{
			@ppuVolume += #$volumeAdded$
		}
	}
}