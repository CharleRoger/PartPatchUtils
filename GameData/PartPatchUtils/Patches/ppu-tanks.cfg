@PART:HAS[@RESOURCE[Oxidizer]]:FOR[zy_PartPatchUtils]
{
	ppuAmountOxidizer = #$RESOURCE[Oxidizer]/maxAmount$
	ppuCostOxidizer = #$ppuAmountOxidizer$
	@ppuCostOxidizer *= #$@RESOURCE_DEFINITION[Oxidizer]/unitCost$
	ppuVolumeOxidizer = #$ppuAmountOxidizer$
	@ppuVolumeOxidizer *= 5
	ppuTankMassOxidizer = #$ppuVolumeOxidizer$
	@ppuTankMassOxidizer *= 0.000125
}

